[package]
name = "analytics-rs"
version = "0.1.0"
edition = "2021"
description = "Reusable analytics processing library for AI telemetry data"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "analytics_benchmark"
harness = false