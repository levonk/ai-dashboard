[package]
name = "ai-analytics-proxy"
version = "0.1.0"
edition = "2021"
description = "AI Analytics Proxy Server - Routes AI requests and collects telemetry"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4.4"
anyhow = "1.0"
thiserror = "1.0"
directories = "5.0"
ctrlc = "3.4"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
indicatif = "0.17"
glob = "0.3"
atty = "0.2"
is-terminal = "0.4"
urlencoding = "2.1"
walkdir = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
chrono = { version = "0.4", features = ["serde"] }
ansi_term = "0.12"
once_cell = "1.18"
uuid = { version = "1.0", features = ["v4", "serde"] }
gethostname = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "fs", "io-util", "time", "net"] }
futures-util = "0.3"
futures = "0.3"
axum = { version = "0.7", features = ["tokio", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "compression-gzip"] }
zeroize = "1.7"
secrecy = "0.8"
which = "6.0"
ratatui = { version = "0.26", optional = true }
cursive = { version = "0.21", optional = true }

redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

regex = "1.10"
analytics-rs = { path = "../../packages/analytics-rs" }
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"

# Hardware monitoring dependencies
nvml-wrapper = "0.12"
sysinfo = "0.30"

# Database dependencies
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }
sqlx-cli = { version = "0.7", optional = true }
rust_decimal = { version = "1.32", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console"] }

[features]
default = []
tui = ["dep:ratatui", "dep:cursive"]

[build-dependencies]
vergen = { version = "8.0", features = ["build", "git", "gitcl"] }
clap_mangen = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
proptest = "1.0"
criterion = "0.5"
